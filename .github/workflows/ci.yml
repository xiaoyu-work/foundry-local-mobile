name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only. Individual jobs (none today) can opt in to write scopes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream ONNX Runtime GenAI commit every job stages so a moving
  # branch cannot make CI flake between two nearby runs.
  OGA_REF: 9d336e4db4e49eeceda909517b882c0d73cc6c86

jobs:
  # ---------------------------------------------------------------------------
  # Shell and workflow linting. Cheap; runs on every PR.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (shellcheck + workflow syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate workflow YAML
        run: |
          python3 -c '
          import sys, yaml, pathlib
          errors = 0
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"OK  {path}")
              except yaml.YAMLError as e:
                  print(f"BAD {path}: {e}")
                  errors += 1
          sys.exit(errors)
          '

  # ---------------------------------------------------------------------------
  # Native Linux build of the core. Doubles as the C++ warning check: the core
  # already compiles with -Wall -Wextra -Wpedantic; we add -Werror here so a
  # newly introduced warning fails CI instead of quietly landing.
  # ---------------------------------------------------------------------------
  linux-core:
    name: core / linux-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/linux/_deps
          key: fetchcontent-linux-${{ matrix.build_type }}-${{ hashFiles('core/CMakeLists.txt') }}

      - name: Configure
        # FLM_BUILD_EXAMPLES=ON adds core/examples/hello_flm.c to the build. Compiling
        # that file as C under -Werror is the whole point of the examples job below:
        # if flm_api.h or flm_types.h grows a C++-only construct, this configure+build
        # is what catches it before every FFI binding breaks at once.
        run: |
          cmake -S core -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFLM_BUILD_SHARED=ON \
            -DFLM_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build/linux --parallel

      - name: Verify the exported ABI matches the header
        # Two invariants land here, both of which have silently regressed
        # before:
        #
        #  1. Every symbol on the dynamic symbol table must be flm_*. Hidden
        #     visibility alone does not hide vague-linkage template
        #     instantiations from std::map & friends, so the core also links
        #     with a --version-script (core/flm.map). If that script does not
        #     take effect — the linker refuses --version-script, or someone
        #     drops the link flag — weak symbols reappear and this check
        #     catches it. On Android's flat namespace an extra exported
        #     symbol can interpose or be interposed by another copy of ORT
        #     the app has loaded, so this really is a bug.
        #
        #  2. The exported count must equal the number of FLM_EXPORT
        #     declarations in the header. Deriving the expected value from
        #     the header (rather than hardcoding a number) means adding a
        #     new ABI function does not require touching this workflow.
        run: |
          so=build/linux/libfoundry_local_mobile.so

          expected=$(grep -h '^FLM_EXPORT' core/include/foundry_local_mobile/*.h | wc -l)
          actual=$(nm -D --defined-only "$so" | awk '$NF ~ /^flm_/' | wc -l)
          echo "FLM_EXPORT declarations in flm_api.h: ${expected}"
          echo "Exported flm_* symbols in $(basename "$so"): ${actual}"

          leaks=$(nm -D --defined-only "$so" \
            | awk '{print $NF}' \
            | grep -Ev '^flm_' || true)
          if [ -n "${leaks}" ]; then
            echo "::error::libfoundry_local_mobile.so exports non-ABI symbols:"
            printf '  %s\n' ${leaks}
            echo "The --version-script (core/flm.map) may not be in effect."
            exit 1
          fi

          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Exported symbol count (${actual}) does not match header (${expected})."
            echo "Update core/flm.map, or check that every ABI function is FLM_EXPORT-declared."
            exit 1
          fi

      - name: Run the C ABI example
        # The C-compat check is really the build step above — if flm_api.h stops
        # compiling as C, hello_flm.c fails there and this step never runs.
        # Running the binary is a small additional signal that the shared library
        # actually loads and the version functions work end-to-end. The example is
        # designed to exit 0 whether or not the upstream runtime is present on the
        # runner (see the header comment in core/examples/hello_flm.c).
        run: build/linux/examples/hello_flm

  # ---------------------------------------------------------------------------
  # Android cross-build via the NDK preinstalled on the GitHub-hosted runner.
  # We do not ship an emulator run: the core dlopens the OGA runtime
  # library, which is not available on a stock public runner. The build itself
  # is the useful signal.
  # ---------------------------------------------------------------------------
  android-cross:
    name: core / android-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Resolve NDK
        # The GitHub-hosted ubuntu image ships one or more NDKs under
        # $ANDROID_HOME/ndk/. Pick the newest so we track upstream, and export
        # ANDROID_NDK_HOME for the build script.
        run: |
          ndk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/ndk"
          if [ ! -d "${ndk_root}" ]; then
            echo "No NDK directory at ${ndk_root}" >&2
            exit 1
          fi
          latest="$(ls -1 "${ndk_root}" | sort -V | tail -n1)"
          echo "ANDROID_NDK_HOME=${ndk_root}/${latest}" >> "$GITHUB_ENV"
          echo "Selected NDK: ${ndk_root}/${latest}"

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/android/cmake/${{ matrix.abi }}/_deps
          key: fetchcontent-android-${{ matrix.abi }}-${{ hashFiles('core/CMakeLists.txt') }}

      - name: Build
        run: ./scripts/build_android.sh --abi ${{ matrix.abi }} --build-type Release

      - name: Verify the Android artifact
        # Three invariants land on every ABI, and each has a specific way it
        # silently regresses:
        #
        #   1. Machine type matches the requested ABI. Guards against a
        #      confused sysroot picking up the host toolchain by accident.
        #   2. Every dynamic symbol on the .so is flm_*, and the count matches
        #      the number of FLM_EXPORT declarations in the header. Same check
        #      the Linux job runs — the version script (core/flm.map) can be
        #      accepted by GCC's ld but ignored or partially applied by lld;
        #      running it against the NDK-produced artifact catches that.
        #   3. libc++_shared.so is present next to libfoundry_local_mobile.so
        #      in the jniLibs output, because the .so lists it as NEEDED and
        #      an AAR that ships the core without it crashes at first load.
        #
        # The 16 KB LOAD-segment alignment invariant (a shipping requirement
        # on Android 15+ / 64-bit) is asserted by build_android.sh itself,
        # inside build_one_abi, so it fails the build step above rather than
        # the verify step.
        run: |
          set -euo pipefail
          abi="${{ matrix.abi }}"
          so="build/android/jniLibs/${abi}/libfoundry_local_mobile.so"
          nm="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          case "${abi}" in
              arm64-v8a)   want_machine="AArch64" ;;
              armeabi-v7a) want_machine="ARM" ;;
              x86_64)      want_machine="Advanced Micro Devices X86-64" ;;
              *)           echo "::error::unknown abi ${abi}"; exit 1 ;;
          esac
          got_machine=$("${readelf}" -h "${so}" | awk -F: '/Machine:/ { sub(/^ */, "", $2); print $2 }')
          if [ "${got_machine}" != "${want_machine}" ]; then
              echo "::error::${so} reports Machine='${got_machine}', expected '${want_machine}'"
              exit 1
          fi

          expected=$(grep -h '^FLM_EXPORT' core/include/foundry_local_mobile/*.h | wc -l)
          actual=$("${nm}" -D --defined-only "${so}" | awk '$NF ~ /^flm_/' | wc -l)
          leaks=$("${nm}" -D --defined-only "${so}" | awk '{print $NF}' | grep -Ev '^flm_' || true)
          echo "FLM_EXPORT declarations: ${expected}; flm_* symbols in ${abi}: ${actual}"
          if [ -n "${leaks}" ]; then
              echo "::error::${so} exports non-ABI symbols:"
              printf '  %s\n' ${leaks}
              echo "lld may be ignoring core/flm.map; check that -Wl,--version-script took effect."
              exit 1
          fi
          if [ "${expected}" != "${actual}" ]; then
              echo "::error::Exported flm_* count (${actual}) does not match header (${expected})."
              exit 1
          fi

          stl="build/android/jniLibs/${abi}/libc++_shared.so"
          if [ ! -f "${stl}" ]; then
              echo "::error::${stl} is missing; the AAR would crash at first load"
              exit 1
          fi

          oga_so="build/android/jniLibs/${abi}/libonnxruntime-genai.so"
          if [ ! -f "${oga_so}" ]; then
              echo "::error::${oga_so} is missing; the core dlopens OGA at runtime"
              exit 1
          fi

          ort_so="build/android/jniLibs/${abi}/libonnxruntime.so"
          if [ ! -f "${ort_so}" ]; then
              echo "::error::${ort_so} is missing; OGA dlopens ORT at runtime"
              exit 1
          fi

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build/android/jniLibs/${{ matrix.abi }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Full Android Gradle binding: assembleRelease produces the AAR that ships
  # to app developers, and packages the core .so, the JNI wrapper .so, and
  # libc++_shared.so for all three ABIs. Building it here is what stops the
  # 23-file Kotlin surface from silently regressing.
  #
  # The build also does a JNI symbol reconciliation: every 'external fun' the
  # Kotlin side declares must have a matching Java_<mangled>_<name> export in
  # the JNI .so. A mismatch compiles cleanly and throws UnsatisfiedLinkError
  # at runtime, so we catch it statically.
  # ---------------------------------------------------------------------------
  android-binding:
    name: bindings / android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner NDK selection: the module pins ndkVersion in build.gradle.kts;
      # AGP downloads it via sdkmanager on demand, which needs licences
      # accepted. Do that non-interactively before Gradle sees the project.
      - name: Accept Android SDK licences
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Cache Gradle wrapper and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('bindings/android/gradle/wrapper/gradle-wrapper.properties', 'bindings/android/build.gradle.kts', 'bindings/android/settings.gradle.kts') }}
          restore-keys: gradle-android-

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache the nested core CMake FetchContent
        # AGP invokes CMake once per ABI under bindings/android/.cxx/, which
        # each fetch nlohmann/json for the core build. Cache that too.
        uses: actions/cache@v4
        with:
          path: bindings/android/.cxx/**/_deps
          key: fetchcontent-android-binding-${{ hashFiles('core/CMakeLists.txt') }}

      - name: Assemble release AAR
        working-directory: bindings/android
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Reconcile JNI symbols against Kotlin external fun declarations
        # Every Kotlin `external fun` must exist as a Java_<pkg>_<class>_<name>
        # export in the JNI .so, and every Java_* export must be reachable
        # from Kotlin. Either direction of drift is a runtime UnsatisfiedLinkError
        # waiting to happen, which no compile step surfaces.
        run: |
          set -euo pipefail
          aar=bindings/android/build/outputs/aar/foundry-local-mobile-release.aar
          workdir=build/android-binding-verify
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          unzip -q "${aar}" -d "${workdir}"
          ls -la "${workdir}/jni/"

          ndk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/ndk"
          latest_ndk="$(ls -1 "${ndk_root}" | sort -V | tail -n1)"
          nm="${ndk_root}/${latest_ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="${workdir}/jni/${abi}/libfoundry_local_mobile_jni.so"
            "${nm}" -D --defined-only "${so}" \
              | awk '$2 == "T" && $3 ~ /^Java_/ { print $3 }' \
              | sort > "${workdir}/jni-${abi}.txt"
          done
          # Every ABI ships the same set of Java_* exports.
          if ! diff -q "${workdir}/jni-arm64-v8a.txt" "${workdir}/jni-armeabi-v7a.txt" \
             || ! diff -q "${workdir}/jni-arm64-v8a.txt" "${workdir}/jni-x86_64.txt"; then
            echo "::error::JNI symbol tables differ across ABIs"
            exit 1
          fi

          python3 scripts/list_kotlin_native_symbols.py bindings/android/src/main/kotlin \
            > "${workdir}/kt.txt"

          missing_jni=$(comm -23 "${workdir}/kt.txt" "${workdir}/jni-arm64-v8a.txt" || true)
          unused_jni=$(comm -13 "${workdir}/kt.txt" "${workdir}/jni-arm64-v8a.txt" || true)
          if [ -n "${missing_jni}" ]; then
            echo "::error::Kotlin external fun declarations without a matching JNI export:"
            printf '  %s\n' ${missing_jni}
            exit 1
          fi
          if [ -n "${unused_jni}" ]; then
            echo "::warning::JNI Java_* exports with no Kotlin caller (dead symbols):"
            printf '  %s\n' ${unused_jni}
            exit 1
          fi
          echo "OK: $(wc -l < "${workdir}/kt.txt") Kotlin external fun ↔ JNI export pairs verified on every ABI."

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: foundry-local-mobile-aar
          path: bindings/android/build/outputs/aar/foundry-local-mobile-release.aar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sample app. Consumes the AAR through the same Maven coordinate a real
  # customer would, via a composite include of bindings/android/. This is the
  # only compile signal we have on the public API surface: if the sample stops
  # building, either the API changed shape or the sample used a symbol that
  # never existed.
  # ---------------------------------------------------------------------------
  android-sample:
    name: samples / android debug APK
    runs-on: ubuntu-latest
    needs: android-binding
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Cache Gradle wrapper and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-sample-${{ hashFiles('samples/android/gradle/wrapper/gradle-wrapper.properties', 'samples/android/**/build.gradle.kts', 'samples/android/settings.gradle.kts', 'bindings/android/build.gradle.kts') }}
          restore-keys: |
            gradle-android-sample-
            gradle-android-

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache the nested core CMake FetchContent
        uses: actions/cache@v4
        with:
          path: bindings/android/.cxx/**/_deps
          key: fetchcontent-android-binding-${{ hashFiles('core/CMakeLists.txt') }}

      - name: Assemble debug APK
        working-directory: samples/android
        # assembleDebug rather than Release: the sample has no signing config
        # and the CI signal we want is the compile, not a shippable artifact.
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Verify the APK carries all three target ABIs with the shipped libs
        run: |
          set -euo pipefail
          apk=samples/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "${apk}" || { echo "::error::sample APK missing at ${apk}"; exit 1; }
          libs=$(unzip -l "${apk}" | awk '/lib\/.*\.so$/ {print $4}' | sort -u)
          echo "${libs}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for so in libfoundry_local_mobile.so libfoundry_local_mobile_jni.so libc++_shared.so libonnxruntime-genai.so libonnxruntime.so; do
              if ! grep -qx "lib/${abi}/${so}" <<<"${libs}"; then
                echo "::error::sample APK missing lib/${abi}/${so}"
                exit 1
              fi
            done
          done
          # No stray x86 slice from transitive AndroidX libs — abiFilters kept the APK matched.
          if grep -qE '^lib/x86/' <<<"${libs}"; then
            echo "::error::sample APK contains lib/x86/ (abiFilters regression)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foundry-local-sample-android-debug
          path: samples/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flutter plugin and its example app. Two things matter here:
  #
  #   1. flutter analyze on both the plugin and the example. Dart analysis is
  #      the only compile-time signal Dart code has, so the closest thing to
  #      "did the plugin's public API keep compiling" is analyzing an app that
  #      consumes it exclusively through foundry_local_mobile.dart.
  #   2. flutter build apk --debug on the example. That drives the CMake
  #      ExternalNativeBuild of the core through the plugin's Gradle module,
  #      packages the resulting libfoundry_local_mobile.so + libc++_shared.so
  #      for all three ABIs, and produces an APK with the plugin as a real
  #      transitive dependency. The APK is then asserted to carry the right
  #      slices — mirroring the samples/android check so a plugin-side ABI
  #      regression fails here rather than silently on a user's device.
  #
  # The Flutter SDK is fetched into a tarball under $RUNNER_TEMP rather than
  # via a third-party install action, matching this workflow's zero
  # third-party-action policy.
  # ---------------------------------------------------------------------------
  flutter-example:
    name: bindings / flutter example APK
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.24.5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Cache Flutter SDK tarball
        id: cache-flutter
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: flutter-sdk-${{ env.FLUTTER_VERSION }}-linux

      - name: Install Flutter SDK
        if: steps.cache-flutter.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/flutter-sdk"
          cd "${RUNNER_TEMP}/flutter-sdk"
          curl -fsSL -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xf flutter.tar.xz
          rm flutter.tar.xz

      - name: Put Flutter on PATH and pre-cache Dart artifacts
        run: |
          echo "${RUNNER_TEMP}/flutter-sdk/flutter/bin" >> "${GITHUB_PATH}"
          # `flutter --version` primes the SDK's Dart tooling cache; the
          # subsequent pub get / analyze steps otherwise download it lazily
          # once per step.
          "${RUNNER_TEMP}/flutter-sdk/flutter/bin/flutter" --version
          "${RUNNER_TEMP}/flutter-sdk/flutter/bin/flutter" precache --android --no-ios --no-web --no-linux --no-macos --no-windows

      - name: Cache Gradle wrapper and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-flutter-example-${{ hashFiles('bindings/flutter/example/android/**/*.gradle', 'bindings/flutter/example/android/gradle/wrapper/gradle-wrapper.properties', 'bindings/flutter/android/build.gradle') }}
          restore-keys: |
            gradle-flutter-example-
            gradle-android-

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache the nested core CMake FetchContent
        # Same rationale as android-binding: AGP invokes CMake once per ABI
        # under bindings/flutter/android/.cxx/ and each fetches nlohmann/json.
        uses: actions/cache@v4
        with:
          path: bindings/flutter/android/.cxx/**/_deps
          key: fetchcontent-flutter-example-${{ hashFiles('core/CMakeLists.txt') }}

      - name: flutter pub get (plugin)
        working-directory: bindings/flutter
        run: flutter pub get

      - name: flutter pub get (example)
        working-directory: bindings/flutter/example
        run: flutter pub get

      - name: flutter analyze (plugin)
        working-directory: bindings/flutter
        run: flutter analyze

      - name: flutter analyze (example)
        working-directory: bindings/flutter/example
        run: flutter analyze

      - name: Build the example debug APK
        working-directory: bindings/flutter/example
        # --debug rather than --release: the example has no signing config
        # and the CI signal we want is that the plugin's Gradle module and
        # ExternalNativeBuild of the core both go through end to end.
        run: flutter build apk --debug

      - name: Verify the APK carries all three target ABIs with the shipped libs
        # Mirrors the assertion the android-sample job makes: a regression in
        # the plugin's abiFilters would put lib/x86/libflutter.so back in
        # without a matching lib/x86/libfoundry_local_mobile.so, and Android's
        # install-time ABI matcher would then place the APK on a 32-bit x86
        # image that immediately crashes at DynamicLibrary.open.
        run: |
          set -euo pipefail
          apk=bindings/flutter/example/build/app/outputs/flutter-apk/app-debug.apk
          test -s "${apk}" || { echo "::error::example APK missing at ${apk}"; exit 1; }
          libs=$(unzip -l "${apk}" | awk '/lib\/.*\.so$/ {print $4}' | sort -u)
          echo "${libs}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for so in libfoundry_local_mobile.so libc++_shared.so libonnxruntime-genai.so libonnxruntime.so; do
              if ! grep -qx "lib/${abi}/${so}" <<<"${libs}"; then
                echo "::error::example APK missing lib/${abi}/${so}"
                exit 1
              fi
            done
          done
          if grep -qE '^lib/x86/' <<<"${libs}"; then
            echo "::error::example APK contains lib/x86/ (abiFilters regression)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foundry-local-flutter-example-android-debug
          path: bindings/flutter/example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # React Native binding. Two signals, both reachable without a Mac or a device:
  #
  #   1. `tsc --noEmit` over the public TypeScript surface.
  #   2. A real Kotlin compile of the Android TurboModule against the Kotlin
  #      binding it wraps.
  #
  # (2) is the one that matters. The module extends the codegen'd abstract
  # class `NativeFoundryLocalSpec`, so compiling it proves every method in the
  # TurboModule spec is implemented -- an unimplemented one is a compile error
  # rather than a runtime "undefined is not a function". It also pins the
  # module to the Kotlin binding's public API: when `FoundryLocal.create`
  # became a `suspend fun`, this is the job that would have caught a stale
  # caller.
  #
  # The module's own build.gradle applies the React Native Gradle plugin, which
  # expects to be resolved from a host app's node_modules. Rather than fake an
  # app, generate the spec with RN's codegen directly and compile the sources
  # in a scratch Gradle project that substitutes a project dependency for the
  # published Maven coordinate.
  #
  # What this cannot catch: the iOS half. RNFoundryLocalCore.swift imports
  # React, so it needs CocoaPods and Xcode. It stays uncompiled, and the
  # README maturity table says so.
  # ---------------------------------------------------------------------------
  react-native-binding:
    name: bindings / react native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Cache Gradle wrapper and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rn-${{ hashFiles('bindings/react-native/android/build.gradle', 'bindings/android/build.gradle.kts') }}
          restore-keys: gradle-rn-

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Install npm dependencies
        working-directory: bindings/react-native
        run: npm ci

      - name: Type-check the TypeScript surface
        working-directory: bindings/react-native
        run: npx tsc --noEmit

      - name: Generate the TurboModule spec
        working-directory: bindings/react-native
        # Two steps, mirroring what the RN Gradle plugin does internally: parse
        # the TS spec into a schema, then emit the Java abstract class that the
        # Kotlin module extends.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rncodegen"
          node node_modules/@react-native/codegen/lib/cli/combine/combine-js-to-schema-cli.js \
            "${RUNNER_TEMP}/rncodegen/schema.json" src/
          node -e "
            const {generate} = require('./node_modules/@react-native/codegen/lib/generators/RNCodegen.js');
            const schema = require(process.env.RUNNER_TEMP + '/rncodegen/schema.json');
            generate(
              {
                libraryName: 'RNFoundryLocalSpec',
                schema,
                outputDirectory: process.env.RUNNER_TEMP + '/rncodegen/out',
                packageName: 'com.foundrylocal.reactnative',
              },
              {generators: ['modulesAndroid']},
            );
          "
          find "${RUNNER_TEMP}/rncodegen/out" -name '*.java'

      - name: Compile the Android TurboModule against the Kotlin binding
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/rn-harness"
          rm -rf "${harness}"
          mkdir -p "${harness}/rnmodule"
          repo="$(pwd)"
          rn_version="$(node -p "require('${repo}/bindings/react-native/node_modules/react-native/package.json').version")"

          cat > "${harness}/settings.gradle.kts" <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "rncheck"
          include(":binding")
          project(":binding").projectDir = file("${repo}/bindings/android")
          include(":rnmodule")
          EOF

          cat > "${harness}/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.library") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.20" apply false
          }
          EOF

          cat > "${harness}/rnmodule/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat > "${harness}/rnmodule/build.gradle.kts" <<EOF
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }
          android {
              namespace = "com.foundrylocal.reactnative"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              sourceSets["main"].java.srcDirs(
                  "${repo}/bindings/react-native/android/src/main/java",
                  "${RUNNER_TEMP}/rncodegen/out/java",
              )
              sourceSets["main"].manifest.srcFile("${harness}/rnmodule/AndroidManifest.xml")
          }
          dependencies {
              implementation("com.facebook.react:react-android:${rn_version}")
              implementation(project(":binding"))
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
          }
          EOF

          cp "${repo}/bindings/android/gradle.properties" "${harness}/"
          cp -r "${repo}/bindings/android/gradle" "${harness}/"
          cp "${repo}/bindings/android/gradlew" "${harness}/"

          cd "${harness}"
          ./gradlew --no-daemon :rnmodule:compileReleaseKotlin :rnmodule:compileReleaseJavaWithJavac

      - name: Reconcile the spec against the implementation
        # compileReleaseKotlin already fails on a missing override, because the
        # codegen'd spec is abstract. This puts the count in the log and fails
        # loudly if codegen ever emits a method the module does not implement.
        run: |
          set -euo pipefail
          spec="$(find "${RUNNER_TEMP}/rncodegen/out" -name 'NativeFoundryLocalSpec.java')"
          grep -oE 'public abstract [A-Za-z<>@ .]+ ([a-zA-Z]+)\(' "${spec}" \
            | grep -oE '[a-zA-Z]+\($' | tr -d '(' | sort > "${RUNNER_TEMP}/spec.txt"
          grep -oE 'override fun ([a-zA-Z]+)' \
            bindings/react-native/android/src/main/java/com/foundrylocal/reactnative/FoundryLocalModule.kt \
            | awk '{print $3}' | sort > "${RUNNER_TEMP}/impl.txt"
          missing="$(comm -23 "${RUNNER_TEMP}/spec.txt" "${RUNNER_TEMP}/impl.txt" || true)"
          if [ -n "${missing}" ]; then
            echo "::error::TurboModule spec methods with no Kotlin override:"
            printf '  %s\n' ${missing}
            exit 1
          fi
          echo "OK: $(wc -l < "${RUNNER_TEMP}/spec.txt") spec methods, all implemented."

  # ---------------------------------------------------------------------------
  # Linux type-check of the Swift binding's Foundation subset. Runs against
  # the real C ABI headers under core/include via a hand-written module map.
  # No Mac needed, no XCFramework, no simulator.
  #
  # What this catches: Codable / Sendable / @convention(c) mismatches; missing
  # imports; the same class of latent bug that showed up the first time this
  # code was ever fed to a compiler (a `while let` on a flattened `Data?`, an
  # enum used as an Encodable field without conforming to Codable, a whole
  # file that referenced C symbols with no `import FoundryLocalMobile`).
  #
  # What this cannot catch: anything Darwin- or UIKit-dependent.
  # `LifecycleObserver.swift` and one stored property of `FoundryLocal` sit
  # behind `#if canImport(Darwin)` and only get compiled by the macOS job.
  # ---------------------------------------------------------------------------
  ios-binding-linux:
    name: bindings / ios linux type-check
    runs-on: ubuntu-latest
    env:
      SWIFT_VERSION: 5.10.1
      # swift.org spells the same platform two ways in one URL: the directory
      # segment has no dot, the tarball name does. One variable for both is a
      # guaranteed 404.
      SWIFT_PLATFORM_DIR: ubuntu2204
      SWIFT_PLATFORM: ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swift-sdk
          key: swift-sdk-${{ env.SWIFT_VERSION }}-${{ env.SWIFT_PLATFORM_DIR }}

      - name: Install Swift toolchain
        # Direct tarball fetch from swift.org. The workflow policy is no
        # third-party marketplace actions, so swift-actions/setup-swift is
        # not an option; matching the flutter-example approach keeps every
        # toolchain acquisition on this repo consistent.
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/swift-sdk"
          cd "${RUNNER_TEMP}/swift-sdk"
          curl -fsSL -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/${SWIFT_PLATFORM_DIR}/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-${SWIFT_PLATFORM}.tar.gz"
          tar -xzf swift.tar.gz --strip-components=1
          rm swift.tar.gz

      - name: Put Swift on PATH and verify it runs
        run: |
          set -euo pipefail
          echo "${RUNNER_TEMP}/swift-sdk/usr/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/swift-sdk/usr/bin/swift" --version

      - name: Type-check the Swift binding under strict concurrency
        # `-strict-concurrency=complete` promotes every Swift 6 concurrency
        # warning to today's compiler output. That is what surfaced the
        # JSONDecoder-Sendability and four-static-NSLock findings the first
        # time this check ran on the binding.
        #
        # The upcoming features must match the ones Package.swift enables.
        # They did not, once, and the gap hid nineteen `any`-existential
        # errors from this 20-second Linux job until a three-minute macOS
        # build tripped over them. Whatever the manifest turns on, turn on
        # here, so the cheap job is the one that finds it.
        #
        # The module map is written in RUNNER_TEMP so nothing lands under
        # the working tree; it points at core/include with an absolute
        # path (the same pattern used to develop the first pass locally).
        run: |
          set -euo pipefail
          modmap="${RUNNER_TEMP}/foundry-local-mobile.modulemap"
          headers="$(pwd)/core/include/foundry_local_mobile"
          cat > "${modmap}" <<MMAP
          module FoundryLocalMobile [system] {
              header "${headers}/flm_api.h"
              export *
          }
          MMAP
          mapfile -t sources < <(find bindings/ios/Sources/FoundryLocal -name '*.swift' -print | sort)
          printf 'checking %d source files:\n' "${#sources[@]}"
          printf '  %s\n' "${sources[@]}"
          swiftc -typecheck -parse-as-library -module-name FoundryLocal \
            -strict-concurrency=complete \
            -enable-upcoming-feature ExistentialAny \
            -enable-upcoming-feature InferSendableFromCaptures \
            -Xcc -I"${headers}" \
            -Xcc -fmodule-map-file="${modmap}" \
            "${sources[@]}"

  # ---------------------------------------------------------------------------
  # Apple cross-build. macOS runners are slower and more expensive, so this
  # runs on push to main and on PRs that touch code affecting the Apple build.
  # ---------------------------------------------------------------------------
  apple-xcframework:
    name: core / apple xcframework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache ONNX Runtime GenAI source
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-genai
          key: oga-${{ env.OGA_REF }}-v1

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/apple/cmake
          key: fetchcontent-apple-${{ hashFiles('core/CMakeLists.txt') }}

      - name: Build XCFramework
        # --macos because Package.swift declares .macOS(.v12) and the next step
        # runs `swift build`, which targets the host. Without a macOS slice the
        # binary target has nothing to offer and every import fails.
        run: ./bindings/ios/scripts/build_xcframework.sh --build-type Release --macos

      # The XCFramework only proves the C++ core compiles for Apple. The Swift
      # binding on top of it is a separate body of code, and until this step it
      # was never compiled anywhere — a green CI said nothing about it.
      - name: Build the Swift package
        run: swift build --package-path bindings/ios

      # macOS is not enough on its own: the lifecycle observer is behind
      # `canImport(UIKit)`, so building for the host would skip it entirely.
      # An iOS destination is what actually compiles those paths.
      - name: Type-check the Swift package for iOS
        run: |
          xcodebuild build \
            -scheme FoundryLocal \
            -destination 'generic/platform=iOS'
        working-directory: bindings/ios

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: build/apple/FoundryLocalMobile.xcframework
          if-no-files-found: error
