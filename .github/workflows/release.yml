name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to'
        required: true
        type: string

# Read-only by default. The `publish` job below opts into `contents: write` for
# the sole purpose of creating and updating the GitHub Release.
permissions:
  contents: read

env:
  OGA_REF: 9d336e4db4e49eeceda909517b882c0d73cc6c86
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Android AAR / jniLibs bundle.
  # The raw jniLibs bundle, AAR, and local Maven repository all contain both
  # 64-bit ABIs supported by the pinned OGA runtime.
  # ---------------------------------------------------------------------------
  android:
    name: android artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Resolve NDK
        run: |
          ndk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/ndk"
          latest="$(ls -1 "${ndk_root}" | sort -V | tail -n1)"
          echo "ANDROID_NDK_HOME=${ndk_root}/${latest}" >> "$GITHUB_ENV"

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Build Android ABIs
        run: ./scripts/build_android.sh --build-type Release

      - name: Package jniLibs.zip
        run: |
          cd build/android
          zip -r "${GITHUB_WORKSPACE}/foundry-local-mobile-android-jniLibs.zip" jniLibs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "${sdk_status}" -ne 0 ]; then
            echo "::error::sdkmanager --licenses failed with status ${sdk_status}"
            exit "${sdk_status}"
          fi
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"

      - name: Build AAR
        run: |
          cd bindings/android
          ./gradlew --no-daemon --console=plain \
            assembleRelease publishReleasePublicationToReleaseBundleRepository
          cp build/outputs/aar/foundry-local-mobile-release.aar \
             "${GITHUB_WORKSPACE}/foundry-local-mobile-android.aar"
          cd build/maven-repository
          zip -r "${GITHUB_WORKSPACE}/foundry-local-mobile-maven-repository.zip" .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            foundry-local-mobile-android-jniLibs.zip
            foundry-local-mobile-android.aar
            foundry-local-mobile-maven-repository.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Apple XCFramework. Always produced; the iOS binding either bundles it in
  # its Package.swift as a binaryTarget or lets consumers download it directly.
  # ---------------------------------------------------------------------------
  apple:
    name: apple artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ONNX Runtime GenAI
        run: ./scripts/fetch_onnxruntime_genai.sh --ref "${OGA_REF}"

      - name: Build XCFramework
        run: ./scripts/build_apple.sh --build-type Release --macos

      - name: Zip XCFrameworks
        # Bare `zip` preserves symlinks inside the XCFramework, which
        # `actions/upload-artifact` alone does not — critical for iOS
        # dyld_shared_cache resolution.
        run: |
          cd build/apple
          zip -ry "${GITHUB_WORKSPACE}/foundry-local-mobile-apple-xcframework.zip" \
            FoundryLocalMobile.xcframework \
            onnxruntime-genai.xcframework

      - name: Package Swift SDK
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/FoundryLocal"
          mkdir -p "${stage}/Frameworks"
          cp bindings/ios/Package.swift bindings/ios/README.md LICENSE "${stage}/"
          cp -R bindings/ios/Sources "${stage}/"
          cp -R build/apple/FoundryLocalMobile.xcframework "${stage}/Frameworks/"
          cp -R build/apple/onnxruntime-genai.xcframework "${stage}/Frameworks/"
          cd "${RUNNER_TEMP}"
          zip -ry "${GITHUB_WORKSPACE}/foundry-local-mobile-swift-sdk.zip" FoundryLocal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            foundry-local-mobile-apple-xcframework.zip
            foundry-local-mobile-swift-sdk.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flutter pub package. Delegates entirely to the plugin's own pubspec; the
  # only thing this job knows is the directory. `pub publish --dry-run` is the
  # standard packaging step and produces the .tar.gz publish would upload.
  # ---------------------------------------------------------------------------
  flutter:
    name: flutter package
    needs: [android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Flutter binding
        id: probe
        run: |
          if [ -f bindings/flutter/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bindings/flutter is not present; skipping Flutter packaging"
          fi

      - name: Set up Dart
        if: steps.probe.outputs.present == 'true'
        uses: dart-lang/setup-dart@v1

      - name: Download Android SDK
        if: steps.probe.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android-sdk

      - name: Download Apple SDK
        if: steps.probe.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apple
          path: ${{ runner.temp }}/apple-sdk

      - name: Stage native runtimes
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p bindings/flutter/android/libs \
                   bindings/flutter/ios/Frameworks \
                   bindings/flutter/macos/Frameworks
          cp "${RUNNER_TEMP}/android-sdk/foundry-local-mobile-android.aar" \
             bindings/flutter/android/libs/foundry-local-mobile.aar
          mkdir -p "${RUNNER_TEMP}/apple-unpacked"
          unzip -q "${RUNNER_TEMP}/apple-sdk/foundry-local-mobile-apple-xcframework.zip" \
            -d "${RUNNER_TEMP}/apple-unpacked"
          for platform in ios macos; do
            cp -R "${RUNNER_TEMP}/apple-unpacked/FoundryLocalMobile.xcframework" \
              "bindings/flutter/${platform}/Frameworks/"
            cp -R "${RUNNER_TEMP}/apple-unpacked/onnxruntime-genai.xcframework" \
              "bindings/flutter/${platform}/Frameworks/"
          done

      - name: Package Flutter plugin
        if: steps.probe.outputs.present == 'true'
        run: |
          cd bindings/flutter
          dart pub get
          dart pub publish --dry-run
          # `dart pub publish --dry-run` does not emit an archive, but pana +
          # tar of the tracked files matches what the pub server would receive.
          tar -czf "${GITHUB_WORKSPACE}/foundry-local-mobile-flutter.tar.gz" \
            --exclude .dart_tool --exclude build --exclude '*.g.dart' -- .

      - name: Upload
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter
          path: foundry-local-mobile-flutter.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # React Native npm package.
  # ---------------------------------------------------------------------------
  react-native:
    name: react-native package
    needs: [android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for React Native binding
        id: probe
        run: |
          if [ -f bindings/react-native/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bindings/react-native is not present; skipping npm packaging"
          fi

      - name: Set up Node
        if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Android SDK
        if: steps.probe.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android-sdk

      - name: Download Apple SDK
        if: steps.probe.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apple
          path: ${{ runner.temp }}/apple-sdk

      - name: Stage native runtimes and Swift SDK
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p bindings/react-native/android/libs \
                   bindings/react-native/ios/Frameworks \
                   bindings/react-native/ios/FoundryLocal
          cp "${RUNNER_TEMP}/android-sdk/foundry-local-mobile-android.aar" \
             bindings/react-native/android/libs/foundry-local-mobile.aar
          cp -R bindings/ios/Sources/FoundryLocal/. \
             bindings/react-native/ios/FoundryLocal/
          mkdir -p "${RUNNER_TEMP}/apple-unpacked"
          unzip -q "${RUNNER_TEMP}/apple-sdk/foundry-local-mobile-apple-xcframework.zip" \
            -d "${RUNNER_TEMP}/apple-unpacked"
          cp -R "${RUNNER_TEMP}/apple-unpacked/FoundryLocalMobile.xcframework" \
            bindings/react-native/ios/Frameworks/
          cp -R "${RUNNER_TEMP}/apple-unpacked/onnxruntime-genai.xcframework" \
            bindings/react-native/ios/Frameworks/

      - name: Pack
        if: steps.probe.outputs.present == 'true'
        run: |
          cd bindings/react-native
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm pack
          mv ./*.tgz "${GITHUB_WORKSPACE}/foundry-local-mobile-react-native.tgz"

      - name: Upload
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: react-native
          path: foundry-local-mobile-react-native.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attach every artifact produced above to the tagged release.
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: [android, apple, flutter, react-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Flatten dist/<artifact>/... into dist/, since the release UI does
          # not display artifact directories.
          assets=()
          while IFS= read -r -d '' f; do assets+=("$f"); done \
            < <(find dist -type f -print0)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets were produced by upstream jobs." >&2
            exit 1
          fi
          # Create the release lazily so re-runs against an existing tag just
          # add or overwrite assets (--clobber).
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" \
                --title "${RELEASE_TAG}" \
                --generate-notes
          gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
