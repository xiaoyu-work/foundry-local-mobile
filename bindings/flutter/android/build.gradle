group 'com.microsoft.ai.foundry.local.mobile'
version '0.2.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def bundledSdkAar = file('libs/foundry-local-mobile.aar')

android {
    // The Android namespace is required by AGP 7+.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.microsoft.ai.foundry.local.mobile'
    }

    compileSdk 34
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // 21 is the practical floor for ONNX Runtime on Android; going lower is
        // not viable because the runtime uses APIs added in Lollipop.
        minSdk 21

        if (!bundledSdkAar.exists()) {
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++20', '-fvisibility=hidden'
                    arguments '-DANDROID_STL=c++_shared'
                    arguments '-DFLM_BUILD_SHARED=ON'
                    targets 'foundry_local_mobile'
                }
            }
        }

        // ONNX Runtime GenAI has GPU/NPU acceleration paths we do not need in
        // the plugin's own build. Ship the standard 64-bit + 32-bit ABIs.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    if (!bundledSdkAar.exists()) {
        externalNativeBuild {
            cmake {
                path 'CMakeLists.txt'
                version '3.31.6'
            }
        }
    }

    packaging {
        jniLibs {
            pickFirsts += [
                '**/libc++_shared.so',
                '**/libonnxruntime-genai.so',
                '**/libonnxruntime.so'
            ]
        }
    }

    // Older AGP variants do not honour compileSdk-based lint suppression; add
    // it explicitly so the plugin does not fail an app's lint pass.
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    if (bundledSdkAar.exists()) {
        implementation files(bundledSdkAar)
    }
}
