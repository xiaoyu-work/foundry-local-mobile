plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.microsoft.ai.foundry.local.foundry_local_mobile_example"
    compileSdk = flutter.compileSdkVersion
    // Match the NDK the foundry_local_mobile plugin's ExternalNativeBuild
    // pins. Leaving this at Flutter's default surfaced as a Gradle warning
    // during the APK build; setting it here is the recommended fix.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.microsoft.ai.foundry.local.foundry_local_mobile_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Ship only the ABIs the plugin builds. Flutter's default template
        // pulls libflutter.so for a fourth architecture (x86, from
        // io.flutter:flutter_embedding_debug's transitive natives), which
        // the plugin's CMake ExternalNativeBuild does not target. Without
        // this filter the APK installs on a 32-bit x86 image and then
        // crashes at DynamicLibrary.open the moment the SDK is touched.
        // Matches the abiFilters set the native binding and the Android
        // sample already use.
        ndk {
            abiFilters += ["arm64-v8a", "armeabi-v7a", "x86_64"]
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
