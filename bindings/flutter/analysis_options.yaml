include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # ffigen output would fail on strict-inference; keep the generated file exempt.
    always_use_package_imports: ignore
    # FFI struct fields deliberately mirror C names (snake_case), so ignore the
    # camelCase warning on external struct fields.
    non_constant_identifier_names: ignore
  exclude:
    - lib/src/bindings/bindings.dart

linter:
  rules:
    prefer_relative_imports: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true
    always_declare_return_types: true
    directives_ordering: true
    public_member_api_docs: false
